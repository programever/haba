# Build and deploy. Runs on every push to main:
# 1. install the tools, 2. type-check and run the tests, 3. build dist/,
# 4. push dist/ to the gh-pages branch as one fresh commit. GitHub Pages serves that branch.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: Alpha
          user_email: tdtrinh.web@gmail.com
          commit_message: Publish page from
